name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # The canary tests moved to the foundry job: they read selectors out of the compiled artifact
      # rather than hard-coding them, so they need an out/ directory this job does not build. They
      # were failing here from the day they were added.
      - name: Confirm Stage 4 manifest remains fail-closed
        run: |
          node --test tools/lib/test/*.test.mjs
          node --test tools/deployment/test/*.test.mjs
          node --test tools/deathwatch/test/*.test.mjs
          node tools/deployment/verify-manifest.mjs config/stage4-deployment-manifest.json

  review-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The review artifact is defined by Git history, so the tagged audit candidate must be
      # present. A shallow checkout cannot compare it with HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Confirm the reviewed contract sources match the frozen artifact
        run: |
          node --test tools/review/test/*.test.mjs
          node tools/review/package.mjs --ref HEAD --out review-artifact.sums
          node tools/review/package.mjs --ref HEAD --verify review-artifact.sums

  keeper-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/keeper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/keeper/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Confirm disabled example is fail-closed
        run: node monitor.mjs --config ../../config/keeper.example.json --dry-run

  rewards-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/rewards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/rewards/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Reproduce and verify reference campaign
        run: |
          node generate.mjs \
            --snapshot fixtures/ownership.snapshot.json \
            --campaign fixtures/campaign.config.json \
            --output output/campaign.manifest.json
          node verify.mjs \
            --manifest output/campaign.manifest.json \
            --snapshot fixtures/ownership.snapshot.json \
            --campaign fixtures/campaign.config.json

  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Require read-only access to the private production indexer
        env:
          INDEXER_REPO_READ_TOKEN: ${{ secrets.INDEXER_REPO_READ_TOKEN }}
        run: |
          if [ -z "$INDEXER_REPO_READ_TOKEN" ]; then
            echo "::error title=Missing private-indexer token::Add the INDEXER_REPO_READ_TOKEN repository secret with read-only Contents access to Qazza1/OnchainDiligence-indexer."
            exit 1
          fi
      - name: Check out the production indexer event consumer
        uses: actions/checkout@v5
        with:
          repository: Qazza1/OnchainDiligence-indexer
          ref: main
          path: production-indexer
          token: ${{ secrets.INDEXER_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install pinned Solidity dependencies
        run: |
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1
          forge install --no-git foundry-rs/forge-std@v1.16.1
          forge install --no-git uniswap-v3-core=Uniswap/v3-core@v1.0.0
          forge install --no-git uniswap-v3-periphery=Uniswap/v3-periphery@v1.0.0
      - run: forge fmt --check
      - name: Build and report contract sizes
        run: |
          set +e
          forge build --sizes > foundry-build.log 2>&1
          status=$?
          cat foundry-build.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 20 foundry-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/: :/g')"
            echo "::error title=Foundry build failed::$message"
            exit "$status"
          fi
      - run: forge test -vv
      - run: bash tools/check-sizes.sh
      # Compares the compiled ABIs against the indexer's event declarations, so it has to run in
      # the job that actually builds. The deployment-preparation job has no out/ directory.
      - name: Confirm contracts, integration artifact, and production indexer agree
        env:
          DOOM_PRODUCTION_INDEXER_ABI: production-indexer/doom-launchpad-abis.js
        run: node --test tools/integration/test/*.test.mjs
      # Same reason: both read function selectors from the compiled artifacts, so that a renamed or
      # re-typed function fails the build instead of silently reading the wrong storage slot.
      - name: Canary workflow and public page tests
        run: |
          node --test tools/canary/test/*.test.mjs
          node --test web/launch-flow/test/*.test.mjs
          node --test web/launch-detail/test/*.test.mjs
          node --test web/discovery/test/*.test.mjs
          node --test web/lib/test/*.test.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: foundry-build-log
          path: foundry-build.log
          if-no-files-found: ignore

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Solidity dependencies
        run: |
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1
          forge install --no-git foundry-rs/forge-std@v1.16.1
          forge install --no-git uniswap-v3-core=Uniswap/v3-core@v1.0.0
          forge install --no-git uniswap-v3-periphery=Uniswap/v3-periphery@v1.0.0
      - name: Slither 0.11.5
        run: |
          python -m pip install slither-analyzer==0.11.5
          slither . --filter-paths "(lib|test|script)" --json slither-report.json > slither-full.log 2>&1 || true
          set +e
          slither . --filter-paths "(lib|test|script)" --exclude reentrancy-balance --fail-high > slither-gate.log 2>&1
          status=$?
          cat slither-gate.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 slither-gate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/: :/g')"
            echo "::error title=Slither high-severity gate failed::$message"
            exit "$status"
          fi
      - name: Aderyn 0.6.8
        run: npx --yes @cyfrin/aderyn@0.6.8 .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-analysis-reports
          path: |
            slither-report.json
            slither-full.log
            slither-gate.log
            report.md
          if-no-files-found: ignore
