name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install pinned Solidity dependencies
        run: |
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1
          forge install --no-git foundry-rs/forge-std@v1.16.1
          forge install --no-git Uniswap/v3-core@v1.0.0
          forge install --no-git Uniswap/v3-periphery@v1.0.0
      - run: forge fmt --check
      - name: Build and report contract sizes
        run: |
          set +e
          forge build --sizes > foundry-build.log 2>&1
          status=$?
          cat foundry-build.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 20 foundry-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/: :/g')"
            echo "::error title=Foundry build failed::$message"
            exit "$status"
          fi
      - run: forge test -vv
      - run: bash tools/check-sizes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-build-log
          path: foundry-build.log
          if-no-files-found: ignore

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Solidity dependencies
        run: |
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1
          forge install --no-git foundry-rs/forge-std@v1.16.1
          forge install --no-git Uniswap/v3-core@v1.0.0
          forge install --no-git Uniswap/v3-periphery@v1.0.0
      - name: Slither 0.11.5
        run: |
          python -m pip install slither-analyzer==0.11.5
          slither . --filter-paths "(lib|test|script)" --json slither-report.json > slither-full.log 2>&1 || true
          set +e
          slither . --filter-paths "(lib|test|script)" --exclude reentrancy-balance --fail-high > slither-gate.log 2>&1
          status=$?
          cat slither-gate.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 30 slither-gate.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/: :/g')"
            echo "::error title=Slither high-severity gate failed::$message"
            exit "$status"
          fi
      - name: Aderyn 0.6.8
        run: npx --yes @cyfrin/aderyn@0.6.8 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            slither-report.json
            slither-full.log
            slither-gate.log
            report.md
          if-no-files-found: ignore
