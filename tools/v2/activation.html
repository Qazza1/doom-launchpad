<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Doom V2 Factory Activation</title>
  <style>
    body{margin:0;background:#080112;color:#fff;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:24px}.card{border:3px solid #00e5ff;border-radius:18px;background:#150526;padding:26px;box-shadow:8px 8px #000}h1{margin-top:0;color:#80ff00}.warning{padding:14px;border:2px solid #ffcc00;border-radius:10px;color:#ffec91}.row{margin:10px 0;padding:10px;background:#0b0216;border-radius:8px;word-break:break-all}.label{color:#b59acb;font-size:12px;text-transform:uppercase}button{width:100%;margin-top:18px;padding:17px;border:3px solid #000;border-radius:12px;background:#80ff00;font-size:18px;font-weight:900;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ok{color:#80ff00}.error{color:#ff5577}
  </style>
</head>
<body><main class="wrap"><section class="card">
  <h1>Activate Doom Launcher V2</h1>
  <p class="warning">One zero-value transaction only. This resumes the factory; it does not launch a token.</p>
  <div id="details">Loading exact authorized intent…</div>
  <button id="send" disabled>CONNECT RABBY &amp; SEND EXACT ACTIVATION</button>
  <p id="status"></p>
</section></main><script type="module" src="/activation.js"></script></body>
</html>
