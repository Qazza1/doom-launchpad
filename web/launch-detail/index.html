<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoomStreak — Launch detail</title>
  <style>
    :root {
      color-scheme: dark;
      --cyan: #15dff2; --lime: #9cff00; --yellow: #ffe600; --pink: #ff2d96;
      --ink: #f8f5ff; --dim: #8d7ba9; --soft: #c9bce2;
      --panel: #16072a; --deep: #0b0414; --line: #4e3869;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 0 80px; color: var(--ink);
      background:
        radial-gradient(circle at 82% 12%, #55103f 0, transparent 32%),
        radial-gradient(circle at 12% 88%, #062b48 0, transparent 34%), #090415;
    }
    .wrap { width: min(920px, calc(100% - 32px)); margin: 0 auto; }
    .eyebrow { color: var(--cyan); letter-spacing: .14em; font-weight: 800; font-size: 12px; }
    h1 { margin: 8px 0 4px; font-size: clamp(28px, 5vw, 44px); line-height: 1; }
    h1 span { color: var(--pink); }
    .sub { margin: 0 0 22px; color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    section {
      padding: 22px; background: var(--panel); border: 2px solid var(--line);
      border-radius: 16px; box-shadow: 6px 6px 0 #000;
    }
    section.wide { grid-column: 1 / -1; }
    h2 { margin: 0 0 14px; font-size: 15px; color: var(--cyan); letter-spacing: .06em; }

    .badge {
      display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 12px;
      font-weight: 800; letter-spacing: .06em; border: 1px solid var(--line); background: var(--deep);
    }
    .badge[data-tone="success"] { color: var(--lime); border-color: var(--lime); }
    .badge[data-tone="pending"] { color: var(--yellow); border-color: var(--yellow); }
    .badge[data-tone="error"] { color: var(--pink); border-color: var(--pink); }
    .badge[data-tone="partial"] { color: var(--cyan); border-color: var(--cyan); }
    .badge[data-tone="muted"] { color: var(--dim); }
    .say { margin: 12px 0 0; color: var(--soft); font-size: 13px; line-height: 1.65; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 0; text-align: left; border-bottom: 1px solid #2a1c3f; }
    th { color: var(--dim); font-weight: 600; }
    td { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    tr:last-child th, tr:last-child td { border-bottom: none; }
    a { color: var(--cyan); }
    .ok { color: var(--lime); } .bad { color: var(--pink); }

    .bar { height: 10px; margin: 12px 0 6px; border-radius: 999px; background: var(--deep); border: 1px solid var(--line); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--lime); }
    .steps3 { display: flex; gap: 6px; margin-top: 10px; }
    .steps3 div { flex: 1; padding: 8px; text-align: center; border-radius: 8px; background: var(--deep); border: 1px solid var(--line); font-size: 11px; color: var(--dim); }
    .steps3 div[data-done="yes"] { color: var(--lime); border-color: var(--lime); }
    .steps3 div[data-now="yes"] { color: var(--yellow); border-color: var(--yellow); }

    footer.note {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-top: 18px; color: var(--dim); font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    footer.note .warn {
      padding: 3px 9px; border-radius: 999px; border: 1px solid var(--yellow);
      color: var(--yellow); cursor: help;
    }
    #error { display: none; padding: 16px; border-radius: 10px; background: #2a0616; border-left: 4px solid var(--pink); color: #ffd7e6; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">DOOMSTREAK LAUNCHPAD · LAUNCH DETAIL</div>
  <h1 id="title">LOADING<span>…</span></h1>
  <p class="sub" id="subtitle">Reading the chain.</p>

  <div id="error"></div>

  <div class="grid" id="content" hidden>
    <section class="wide">
      <h2>THE COMMITMENT</h2>
      <span class="badge" id="gmBadge" data-tone="muted">—</span>
      <div class="bar"><i id="gmBar" style="width:0%"></i></div>
      <div class="steps3" id="gmSteps"></div>
      <p class="say" id="gmDetail"></p>
    </section>

    <section>
      <h2>PERMANENT LIQUIDITY</h2>
      <span class="badge" id="lockBadge" data-tone="muted">—</span>
      <p class="say" id="lockDetail"></p>
      <table id="lockTable"></table>
    </section>

    <section>
      <h2>ALLOCATION</h2>
      <table id="allocTable"></table>
      <p class="say" id="allocCheck"></p>
    </section>

    <section>
      <h2>MONEY IN, FEES OUT</h2>
      <table id="feeTable"></table>
    </section>

    <section>
      <h2>ADDRESSES</h2>
      <table id="addressTable"></table>
    </section>

  </div>

  <footer class="note" id="freshLine"></footer>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
